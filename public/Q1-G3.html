    <label for="in1" Meal Price: ></label>
    <label for="in2" Tip: ></label>
    <label for="in3" Service Charge: ></label>
<input id="in1" type="number" placeholder="Meal Price"> <br>
<input id="in2" type="number" placeholder="Tip"> <br>
<input id="in3" type="number" placeholder="Service (%)"> <br>

<button onclick="calculateTotal()"> Calculate Total </button>

<div id="total0utput"></div>

<script>

    function calculateTotal() {
        mealPrice = parseFloat(document.getElementById("in1").value);
        tip = parseFloat(document.getElementById("in2").value);
        serviceCharge = parseFloat(document.getElementById("in3").value);

        total = (mealPrice + tip) + (mealPrice *serviceCharge / 100);

        total0utput.innerHTML = "Total Amount: Php" + total.toFixed(2);
    }
</script>
